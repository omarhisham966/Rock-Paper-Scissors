<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <p id="match-over"></p>

    <div class="gameButtons">
        <button class="rockButton">Rock</button>
        <button class="paperButton">Paper</button>
        <button class="scissorsButton">Scissors</button>
    </div>

    <div class="game-dashboard">

        <div class="score-bar">
            <p id="final-score"></p>
            <p>Human: <span id="human-score">0</span></p>
            <p>Computer: <span id="computer-score">0</span></p>
        </div>

        <div class="game-info">
            <p>Choose Your Move Wisely</p>
            <p>Round: <span id="round">1</span></p>
            <p>First to 5 points wins</p>
        </div>

        <div class="results-bar">
            <p>Your Choice: <span id="human-choice"> </span></p>

            <p>Computer's Choice: <span id="computer-choice"> </span></p>

            <p>Result: <span id="round-result"> </span></p>

            <p id="reason"></p>
            
        </div>
    </div>

    <button class="new-game">Try Again</button>

    <script src="script.js" defer></script>
    
</body>
</html>
